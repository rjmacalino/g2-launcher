<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>G2 Launcher</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        /* ER brand dark-theme surface (#232323) + Neutral-200 text (#E5E5E5). */
        background: #232323;
        color: #E5E5E5;
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        /* Kill WebView zoom + iOS auto-sizing + rubber-band scroll. */
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      #companion {
        display: flex;
        flex-direction: column;
        height: calc(100% - 26px);
        box-sizing: border-box;
        padding: 12px;
        overflow-y: auto;
      }
      .back {
        align-self: flex-start;
        margin-bottom: 12px;
        padding: 6px 12px;
        background: #333333;
        border: 1px solid #444444;
        border-radius: 6px;
        color: #E5E5E5;
        font-size: 13px;
      }
      /* The top-level menu mirrors the glasses launcher list, so its rows are
         deliberately plain and larger than a Scripts/Notes item card: this is
         meant to read as "the same menu", not as a third kind of list. */
      .menu-list {
        gap: 4px;
      }
      .menu-item {
        padding: 14px 12px;
        font-size: 16px;
      }
      .stub {
        padding: 20px 4px;
      }
      .stub-title {
        font-size: 16px;
        margin-bottom: 8px;
      }
      .stub-body {
        color: #888888;
      }
      .add {
        margin-bottom: 12px;
        padding: 10px;
        background: #2f6b3a;
        border: none;
        border-radius: 6px;
        color: #ffffff;
        font-size: 14px;
      }
      .list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .item {
        background: #2c2c2c;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 10px;
      }
      .item-title {
        margin-bottom: 8px;
        word-break: break-word;
      }
      .badge {
        background: #2f6b3a;
        color: #ffffff;
        font-size: 11px;
        padding: 2px 6px;
        border-radius: 4px;
      }
      .item-actions {
        display: flex;
        gap: 8px;
      }
      .item-actions button {
        flex: 1;
        padding: 6px;
        background: #3a3a3a;
        border: 1px solid #4a4a4a;
        border-radius: 4px;
        color: #E5E5E5;
        font-size: 13px;
      }
      .empty {
        color: #888888;
        text-align: center;
        padding: 20px 0;
      }
      .editor {
        display: flex;
        flex-direction: column;
        gap: 10px;
        height: 100%;
        box-sizing: border-box;
      }
      .editor .title {
        padding: 10px;
        background: #2c2c2c;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        color: #E5E5E5;
        font-size: 14px;
        box-sizing: border-box;
      }
      .editor .body {
        flex: 1;
        padding: 10px;
        background: #2c2c2c;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        color: #E5E5E5;
        font-size: 14px;
        font-family: inherit;
        resize: none;
        box-sizing: border-box;
      }
      .note-items {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .note-item-row {
        display: flex;
        gap: 6px;
      }
      .note-item-row .item-text {
        flex: 1;
        padding: 8px 10px;
        background: #2c2c2c;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        color: #E5E5E5;
        font-size: 14px;
        box-sizing: border-box;
      }
      .note-item-row .item-remove {
        padding: 8px 10px;
        background: #3a3a3a;
        border: 1px solid #4a4a4a;
        border-radius: 4px;
        color: #E5E5E5;
        font-size: 13px;
      }
      .add-item {
        padding: 8px;
        background: #3a3a3a;
        border: 1px solid #4a4a4a;
        border-radius: 6px;
        color: #E5E5E5;
        font-size: 13px;
      }
      .add-item:disabled {
        opacity: 0.5;
      }
      .editor-actions {
        display: flex;
        gap: 8px;
      }
      .editor-actions button {
        flex: 1;
        padding: 10px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
      }
      .editor-actions .save {
        background: #2f6b3a;
        color: #ffffff;
      }
      .editor-actions .cancel {
        background: #3a3a3a;
        color: #E5E5E5;
      }
      /* An approximation of the glasses canvas, not a pixel-perfect replica -
         see the comment on glassesPreview() in src/companion/main.ts for why one is
         not possible. 576x288 is the real canvas size, so the aspect ratio
         (2:1) is the one thing here that IS exact. */
      .glasses-preview {
        flex-shrink: 0;
      }
      .glasses-screen {
        aspect-ratio: 576 / 288;
        width: 100%;
        box-sizing: border-box;
        background: #000000;
        color: #33ff66;
        font-family: 'Courier New', Courier, monospace;
        font-size: 12px;
        line-height: 1.3;
        padding: 8px;
        white-space: pre-wrap;
        word-break: break-word;
        overflow: hidden;
        border-radius: 4px;
        border: 1px solid #1a1a1a;
      }
      .glasses-caption {
        margin-top: 4px;
        font-size: 11px;
        color: #666666;
        text-align: center;
      }
      #status {
        height: 26px;
        box-sizing: border-box;
        padding: 4px 8px;
        font-size: 11px;
        color: #888888;
        border-top: 1px solid #333333;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="companion"></div>
    <div id="status">Companion app is running. Check the glasses display.</div>
    <script type="module" src="/src/app/main.ts"></script>
    <script type="module" src="/src/companion/main.ts"></script>
  </body>
</html>
